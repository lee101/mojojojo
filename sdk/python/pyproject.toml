[project]
name = "mojojojo"
version = "0.3.0"
description = "Run, precompile, deploy, store data, and search vectors on mojojojo.cc"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["serverless", "execution", "vector-search", "embeddings", "mojo", "compute"]
# No dependencies, on purpose: this is one file over urllib, and a client that
# drags in requests to make one POST is a liability in someone else's env.
dependencies = []

[project.urls]
Homepage = "https://mojojojo.cc"
Documentation = "https://mojojojo.cc/docs"
Repository = "https://github.com/lee101/mojojojo"
Issues = "https://github.com/lee101/mojojojo/issues"

[project.scripts]
mojojojo = "mojojojo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mojojojo"]
