<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PNG to WebP</title>
<style>body{font:16px system-ui;max-width:680px;margin:60px auto;padding:20px}.drop{display:block;padding:60px 20px;border:2px dashed #9b8aac;border-radius:18px;text-align:center}a{display:block;margin-top:25px}</style>
<h1>PNG → WebP</h1><p>This converter is browser-first: uploads never leave the visitor's device.</p><label class="drop">Choose a PNG or JPEG<input id="file" type="file" accept="image/png,image/jpeg" hidden></label><p id="stats"></p>
<script>document.querySelector('#file').onchange=async e=>{const f=e.target.files[0],image=await createImageBitmap(f),canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;canvas.getContext('2d').drawImage(image,0,0);canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.[^.]+$/,'.webp');a.textContent='Download '+a.download;document.body.append(a);document.querySelector('#stats').textContent=Math.round(f.size/1024)+' KB → '+Math.round(blob.size/1024)+' KB'},'image/webp',.82)};</script></html>
