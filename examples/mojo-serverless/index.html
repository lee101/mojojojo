<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mojo serverless</title><style>body{font:18px system-ui;max-width:680px;margin:80px auto;padding:20px}button{padding:12px 18px}</style><h1>A website backed by Mojo</h1><p>The button calls a compiled Mojo function deployed beside this page.</p><button>Call Mojo</button><pre id="out">Ready.</pre><script>document.querySelector('button').onclick=async()=>{const r=await fetch('./api/hello',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});document.querySelector('#out').textContent=await r.text()}</script></html>
